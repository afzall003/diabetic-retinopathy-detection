server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routes (e.g. /results/DR-123) that
    # don't correspond to real files -- without this, refreshing on any
    # route other than / would 404. Falls back to index.html so React
    # Router can handle the routing itself.
    location / {
        try_files $uri /index.html;
    }
}
